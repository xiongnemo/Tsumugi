name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact semver tag to create, e.g. v0.1.0 (leave empty with rehearse)"
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: true
        type: boolean
      rehearse:
        description: "Build, package and smoke-test this commit as a dev build; publish nothing"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - dev
      - master
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          SHOULD_RELEASE="true"
          CREATE_TAG="true"
          COMMIT="$(git rev-parse HEAD)"
          COMMIT12="${COMMIT:0:12}"

          REHEARSE="${{ inputs.rehearse || false }}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${REHEARSE}" != "true" ]]; then
            BASE_TAG="${{ inputs.version }}"
            TAG="${BASE_TAG}"
            if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "version must be an exact semver tag like v0.1.0" >&2
              exit 1
            fi
            if git rev-parse "${TAG}" >/dev/null 2>&1; then
              echo "tag ${TAG} already exists" >&2
              exit 1
            fi
            BRANCH="${GITHUB_REF_NAME}"
            PRERELEASE="${{ inputs.prerelease }}"
          else
            BRANCH="${GITHUB_REF_NAME}"
            if [[ -z "${BRANCH}" ]]; then
              BRANCH="release"
            fi
            PRERELEASE="true"

            EXACT_TAGS="$(git tag --merged HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
            BASE_EXACT_TAG="$(echo "${EXACT_TAGS}" | head -n 1)"
            if [[ -z "${BASE_EXACT_TAG}" ]]; then
              echo "No exact semver base tag found; skipping automated prerelease."
              SHOULD_RELEASE="false"
              BASE_TAG="v0.0.1"
              TAG=""
            else
              COMMITS_SINCE="$(git rev-list "${BASE_EXACT_TAG}..HEAD" --count)"
              if [[ "${COMMITS_SINCE}" == "0" ]]; then
                echo "HEAD is the exact base tag; skipping automated prerelease."
                SHOULD_RELEASE="false"
                BASE_TAG="${BASE_EXACT_TAG}"
                TAG=""
              else
                BASE="${BASE_EXACT_TAG#v}"
                IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE}"
                NEXT_PATCH=$((PATCH + COMMITS_SINCE))
                BASE_TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
              fi
            fi
          fi

          SAFE_BRANCH="$(echo "${BRANCH}" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [[ -z "${SAFE_BRANCH}" ]]; then
            SAFE_BRANCH="release"
          fi
          if [[ "${SHOULD_RELEASE}" == "true" ]]; then
            RELEASE_VERSION="${BASE_TAG}-${SAFE_BRANCH}-${COMMIT12}"
            if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" || "${REHEARSE}" == "true" ]]; then
              TAG="${RELEASE_VERSION}"
              if git rev-parse "${TAG}" >/dev/null 2>&1; then
                echo "Tag ${TAG} already exists; skipping automated prerelease."
                SHOULD_RELEASE="false"
              fi
            fi
          else
            RELEASE_VERSION=""
          fi

          # A release created from an exact version is packaged as that version;
          # every other build is a prerelease of the next one, 0.1.64~pre-1 (apk
          # 0.1.64_pre-r1), which apk-tools accepts where nFPM's default
          # 0.1.64_dev-<commit> spelling is invalid. A rehearsal builds, packages
          # and smoke-tests exactly what a push would, and publishes nothing.
          if [[ "${TAG}" == "${BASE_TAG}" && -n "${TAG}" ]]; then
            PACKAGE_VERSION="${BASE_TAG#v}"
          else
            PACKAGE_VERSION="${BASE_TAG#v}-pre"
          fi
          PUBLISH="true"
          if [[ "${REHEARSE}" == "true" ]]; then
            PUBLISH="false"
          fi
          CHANNEL="nightly"
          if [[ "${PRERELEASE}" != "true" ]]; then
            CHANNEL="stable"
          fi

          {
            echo "publish=${PUBLISH}"
            echo "package_version=${PACKAGE_VERSION}"
            echo "channel=${CHANNEL}"
            echo "should_release=${SHOULD_RELEASE}"
            echo "create_tag=${CREATE_TAG}"
            echo "tag=${TAG}"
            echo "branch=${SAFE_BRANCH}"
            echo "commit=${COMMIT}"
            echo "commit12=${COMMIT12}"
            echo "base_tag=${BASE_TAG}"
            echo "release_version=${RELEASE_VERSION}"
            echo "prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Run tests
        if: steps.meta.outputs.should_release == 'true'
        run: go test ./...

      - name: Build release artifacts
        if: steps.meta.outputs.should_release == 'true'
        shell: bash
        env:
          BASE_TAG: ${{ steps.meta.outputs.base_tag }}
          RELEASE_VERSION: ${{ steps.meta.outputs.release_version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          BRANCH: ${{ steps.meta.outputs.branch }}
        run: |
          set -euo pipefail
          mkdir -p dist out

          LDFLAGS="-s -w"
          LDFLAGS="${LDFLAGS} -X github.com/nemo/Tsumugi/internal/version.version=${BASE_TAG}"
          LDFLAGS="${LDFLAGS} -X github.com/nemo/Tsumugi/internal/version.commit=${COMMIT}"
          LDFLAGS="${LDFLAGS} -X github.com/nemo/Tsumugi/internal/version.branch=${BRANCH}"
          LDFLAGS="${LDFLAGS} -X github.com/nemo/Tsumugi/internal/version.dirty=false"

          targets=(
            "windows/amd64"
            "windows/arm64"
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "freebsd/amd64"
            "freebsd/arm64"
            "openbsd/amd64"
            "openbsd/arm64"
          )

          for target in "${targets[@]}"; do
            IFS=/ read -r goos goarch <<< "${target}"
            name="tsumugi_${RELEASE_VERSION}_${goos}_${goarch}"
            rm -rf "dist/${name}"
            mkdir -p "dist/${name}"

            if [[ "${goos}" == "windows" ]]; then
              bin="tsumugi.exe"
            else
              bin="tsumugi"
            fi

            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -buildvcs=false -ldflags="${LDFLAGS}" -o "dist/${name}/${bin}" ./cmd/tsumugi

            if [[ "${goos}" == "windows" ]]; then
              (cd "dist/${name}" && zip -9 "../../out/${name}.zip" "${bin}")
            else
              tar -C "dist/${name}" -czf "out/${name}.tar.gz" "${bin}"
            fi
          done

          (cd out && sha256sum * > "checksums_${RELEASE_VERSION}.txt")

      - name: Verify embedded version
        if: steps.meta.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify
          tar -C verify -xzf "out/tsumugi_${{ steps.meta.outputs.release_version }}_linux_amd64.tar.gz"
          GOT="$(verify/tsumugi --version)"
          WANT="${{ steps.meta.outputs.release_version }}"
          if [[ "${GOT}" != "${WANT}" ]]; then
            echo "embedded version mismatch: got ${GOT}, want ${WANT}" >&2
            exit 1
          fi

      # The Linux builds packaged for apt, dnf and apk -- and for
      # https://package.anzupop.com, which indexes these assets where they are
      # published. Every package is installed and run on its distribution before
      # anything is tagged or released.
      - name: Package for Linux
        if: steps.meta.outputs.should_release == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.release_version }}
          PACKAGE_VERSION: ${{ steps.meta.outputs.package_version }}
          NFPM_RELEASE: v2.48.0
        run: |
          set -euo pipefail
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_RELEASE}"
          for arch in amd64 arm64; do
            name="tsumugi_${RELEASE_VERSION}_linux_${arch}"
            sed -e "s|@NFPM_ARCH@|${arch}|g" \
                -e "s|@NFPM_VERSION@|${PACKAGE_VERSION}|g" \
                -e "s|@NFPM_BINARY@|${PWD}/dist/${name}/tsumugi|g" \
                -e "s|@TSUMUGI_VERSION@|${RELEASE_VERSION}|g" \
                packaging/nfpm.yaml > "dist/nfpm-${arch}.yaml"
            for format in deb rpm apk; do
              nfpm package --config "dist/nfpm-${arch}.yaml" --packager "${format}" --target "out/${name}.${format}"
            done
          done
          dpkg-deb -f "out/tsumugi_${RELEASE_VERSION}_linux_amd64.deb" Package Version Architecture
          (cd out && rm -f checksums_*.txt && sha256sum * > "checksums_${RELEASE_VERSION}.txt")

      - name: Set up QEMU
        if: steps.meta.outputs.should_release == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Smoke-install the packages
        if: steps.meta.outputs.should_release == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.release_version }}
        run: |
          set -euo pipefail
          run() {
            local platform=$1 image=$2 format=$3 arch=$4
            echo "== ${format} on ${image} (${platform})"
            docker run --rm --platform "${platform}" -e FORMAT="${format}" -e WANT="${RELEASE_VERSION}" \
              -v "${PWD}/out/tsumugi_${RELEASE_VERSION}_linux_${arch}.${format}:/pkg.${format}:ro" "${image}" sh -euc '
                case "$FORMAT" in
                  deb) apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /pkg.deb ;;
                  rpm) dnf install -y -q /pkg.rpm ;;
                  apk) apk add --no-cache --allow-untrusted /pkg.apk ;;
                esac
                got=$(tsumugi --version)
                echo "tsumugi --version: $got"
                [ "$got" = "$WANT" ]
              '
          }
          run linux/amd64 debian:stable deb amd64
          run linux/amd64 ubuntu:24.04 deb amd64
          run linux/amd64 fedora:latest rpm amd64
          run linux/amd64 rockylinux:9 rpm amd64
          run linux/amd64 alpine:3.21 apk amd64
          run linux/amd64 alpine:3.24 apk amd64
          run linux/arm64 debian:stable deb arm64
          run linux/arm64 alpine:3.24 apk arm64

      - name: Create tag
        if: steps.meta.outputs.should_release == 'true' && steps.meta.outputs.create_tag == 'true' && steps.meta.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git tag "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.commit }}"
          git push origin "${{ steps.meta.outputs.tag }}"

      - name: Upload workflow artifacts
        if: steps.meta.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tsumugi-${{ steps.meta.outputs.release_version }}
          path: out/*
          if-no-files-found: error

      - name: Create GitHub release
        if: steps.meta.outputs.should_release == 'true' && steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${{ steps.meta.outputs.tag }}" out/* \
            --title "Tsumugi ${{ steps.meta.outputs.tag }}" \
            --notes "Automated release for ${{ steps.meta.outputs.release_version }}." \
            "${args[@]}"

      # The package repository fetches this release by tag and hashes the assets
      # itself, so all this sends is which release to look at; it also passes the
      # release on to the Scoop bucket. Without the token the release still ships
      # and the repository's own sweep picks it up later.
      - name: Tell the package repository
        if: steps.meta.outputs.should_release == 'true' && steps.meta.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
          PACKAGES_REPO: ${{ vars.PACKAGES_REPO || 'xiongnemo/packages' }}
          TAG: ${{ steps.meta.outputs.tag }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PACKAGES_DISPATCH_TOKEN is not set; ${PACKAGES_REPO} will pick this up on its own schedule."
            exit 0
          fi
          gh api "repos/${PACKAGES_REPO}/dispatches" \
            -f event_type=release-published \
            -f "client_payload[repository]=${GITHUB_REPOSITORY}" \
            -f "client_payload[tag]=${TAG}" \
            -f "client_payload[channel]=${CHANNEL}" \
            -f "client_payload[sha]=${GITHUB_SHA}" \
            || echo "::warning title=Package repository not notified::dispatch to ${PACKAGES_REPO} failed; its scheduled sweep is the backstop."
